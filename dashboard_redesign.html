// ── Helpers ──
function useFetch(url) {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  useEffect(() => {
    let cancelled = false;
    setLoading(true);
    fetch(url).then(r => { if (!r.ok) throw new Error(r.statusText); return r.json(); })
      .then(d => { if (!cancelled) { setData(d); setLoading(false); } })
      .catch(e => { if (!cancelled) { setError(e.message); setLoading(false); } });
    return () => { cancelled = true; };
  }, [url]);
  return { data, loading, error };
}

function Loading() {
  return React.createElement('div', { className: 'flex items-center justify-center h-[50vh] text-[#58587a] font-mono text-sm' },

      React.createElement('div', null, 'Loading data...')
    )
  );
}

function ErrorMsg({ message }) {

      React.createElement('div', { className: 'text-[#58587a] text-xs mt-4' }, 'Ensure API server is running: python api_server.py')
    )
  );
}

function useCountUp(end, duration = 1500, start = 0) {
  const [value, setValue] = useState(start);
  const frameRef = useRef();
  const startTime = useRef();
  useEffect(() => {
    if (end === undefined) return;
    startTime.current = performance.now();
    const tick = (now) => {
      const elapsed = now - startTime.current;
      const progress = Math.min(elapsed / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      setValue(Math.round(start + (end - start) * eased));
      if (progress < 1) frameRef.current = requestAnimationFrame(tick);
    };
    frameRef.current = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(frameRef.current);
  }, [end, duration, start]);
  return end >= 1000 ? value.toLocaleString() : value;
}

function liveTime() {
  const [ts, setTs] = useState(new Date().toISOString().replace('T',' ').slice(0,19)+'Z');
  useEffect(() => { const i = setInterval(() => setTs(new Date().toISOString().replace('T',' ').slice(0,19)+'Z'), 1000); return () => clearInterval(i); }, []);
  return ts;
}

    window.addEventListener('resize', handler);
    return () => window.removeEventListener('resize', handler);
  }, []);

  const pages = {
    overview: OverviewPage,
    'test-session': TestSessionPage,
    models: ModelsPage,
    explanations: ExplanationsPage,
    mitm: MitmPage,
    capture: CapturePage,
    grafana: GrafanaPage,
  };

  const Page = pages[page] || pages.overview;

  return React.createElement('div', { className: 'flex min-h-screen bg-[#08080f] bg-grid' },
    React.createElement(Sidebar, { active: page, onNavigate: setPage, collapsed: sidebarCollapsed, onToggle: () => setSidebarCollapsed(!sidebarCollapsed) }),
    React.createElement('main', { className: `flex-1 transition-all duration-200 ${sidebarCollapsed ? 'ml-16' : 'ml-56'} p-5 md:p-8 max-w-7xl` },
      React.createElement(Page, null)
    )
  );
}

const root = createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
