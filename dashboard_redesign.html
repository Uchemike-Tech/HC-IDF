function useFetch(url) {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  useEffect(() => {
    let cancelled = false;
    setLoading(true);
    fetch(url).then(r => { if (!r.ok) throw new Error(r.statusText); return r.json(); })
      .then(d => { if (!cancelled) { setData(d); setLoading(false); } })
      .catch(e => { if (!cancelled) { setError(e.message); setLoading(false); } });
    return () => { cancelled = true; };
  }, [url]);
  return { data, loading, error };
}

function useCountUp(end, duration = 1500, start = 0) {
  const [value, setValue] = useState(start);

  useEffect(() => {
    if (end === undefined) return;
    startTime.current = performance.now();
    const tick = (now) => {

      const progress = Math.min(elapsed / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);

      if (progress < 1) frameRef.current = requestAnimationFrame(tick);
    };
    frameRef.current = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(frameRef.current);

          React.createElement('div', { className: 'text-[var(--text-nav-hover)] mt-1' }, 'http://localhost:3000'),
          React.createElement('div', { className: 'mt-4 text-[10px]' },
            'Start with: ', React.createElement('span', { className: 'text-[var(--text-nav-hover)]' }, 'docker-compose -f grafana/docker-compose.yml up -d'),
          ),
          React.createElement('div', { className: 'mt-6 text-[10px] leading-relaxed text-[var(--text-muted)]' },
            'Default login: admin / admin', React.createElement('br', null),
            'Configure Prometheus data source + import dashboard JSON from grafana/provisioning/dashboards/'
          )
        )
      )
    )
  );
}

// ═══════════════════════════════════════════
//  APP
// ═══════════════════════════════════════════
function App() {
  const [page, setPage] = useState('overview');
  const [sidebarCollapsed, setSidebarCollapsed] = useState(window.innerWidth < 768);

  useEffect(() => {
    const handler = () => setSidebarCollapsed(window.innerWidth < 768);
    window.addEventListener('resize', handler);
    return () => window.removeEventListener('resize', handler);
  }, []);

  const pages = {
    overview: OverviewPage,
    'test-session': TestSessionPage,
    models: ModelsPage,
    explanations: ExplanationsPage,
    mitm: MitmPage,
    capture: CapturePage,
    grafana: GrafanaPage,
  };

  const Page = pages[page] || pages.overview;

  return React.createElement('div', { className: 'flex min-h-screen bg-[var(--bg-primary)] bg-grid' },
    React.createElement(Sidebar, { active: page, onNavigate: setPage, collapsed: sidebarCollapsed, onToggle: () => setSidebarCollapsed(!sidebarCollapsed) }),
    React.createElement('main', { className: `flex-1 transition-all duration-200 ${sidebarCollapsed ? 'ml-16' : 'ml-56'} p-5 md:p-8 max-w-7xl` },
      React.createElement(Page, null)
    )
  );
}

const root = createRoot(document.getElementById('root'));
root.render(React.createElement(ThemeProvider, null, React.createElement(App)));
</script>
</body>
